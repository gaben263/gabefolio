<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description" content="Gabriel Nascimento — Product Designer & UI/UX focado em experiências digitais de alta performance e soluções de produto escaláveis." />
  <title>Gabriel Nascimento · Product Designer & UI/UX</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:      '#FFFFFF',
            surface: '#F9F9FB',
            surface2:'#EAEAEF',
            accent:  '#6D28D9',   /* roxo principal */
            gold:    '#C9A96E',   /* dourado — detalhes mínimos */
            border:  '#E5E7EB',
            text:    '#1F2937',
            muted:   '#6B7280',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    html, body {
      background-color: #FFFFFF;
      color: #1F2937;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ── Scrollbar ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #F9F9FB; }
    ::-webkit-scrollbar-thumb { background: #6D28D944; border-radius: 99px; }

    /* ── Purple gradient text ──────────────────────── */
    .purple-text {
      background: linear-gradient(135deg, #6D28D9 0%, #8B5CF6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Gold section divider ──────────────────────── */
    .s-line {
      width: 36px; height: 2px;
      background: linear-gradient(90deg, #C9A96E, transparent);
      margin-bottom: 14px;
    }

    /* ── Fade-up animations ────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 0.4s; }
    .d4 { animation-delay: 0.55s; }

    /* ── Card hover lift ───────────────────────────── */
    .card-lift {
      transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94),
                  box-shadow 0.4s ease,
                  border-color 0.25s ease;
    }
    .card-lift:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(109,40,217,0.10);
      border-color: #6D28D944;
    }

    /* ── Nav underline ─────────────────────────────── */
    .nav-link { position: relative; }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 1.5px;
      background: #6D28D9;
      transition: width 0.35s ease;
    }
    .nav-link:hover::after { width: 100%; }

    /* ── Carousel ──────────────────────────────────── */
    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      gap: 16px;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }
    .carousel-item {
      scroll-snap-align: start;
      flex: 0 0 calc(33.333% - 11px);
    }
    @media (max-width: 768px) {
      .carousel-item { flex: 0 0 80%; }
    }

    /* ── Image transition ──────────────────────────── */
    img { transition: transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94); }

    /* ── Buttons ───────────────────────────────────── */
    .btn-purple {
      display: inline-block;
      background: #6D28D9;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 13px 28px;
      border-radius: 10px;
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
    }
    .btn-purple:hover {
      background: #5B21B6;
      box-shadow: 0 8px 28px rgba(109,40,217,0.28);
      transform: translateY(-1px);
    }
    .btn-ghost {
      display: inline-block;
      color: #6B7280;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 12px 28px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      transition: border-color 0.3s, color 0.3s, background 0.3s;
    }
    .btn-ghost:hover {
      border-color: #6D28D9;
      color: #6D28D9;
      background: #6D28D908;
    }

    /* ── Lightbox ──────────────────────────────────── */
    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes imgIn {
      from { opacity: 0; transform: scale(0.94) translateY(12px); }
      to   { opacity: 1; transform: scale(1)    translateY(0);    }
    }
    .lb-overlay { animation: overlayIn 0.25s ease forwards; }
    .lb-img     { animation: imgIn     0.35s cubic-bezier(0.16,1,0.3,1) forwards; }

    /* Chip pill */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F9F9FB;
      border: 1px solid #E5E7EB;
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #6B7280;
    }
  </style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

// ─────────────────────────────────────────────────────────────────────────────
// LIGHTBOX
// ─────────────────────────────────────────────────────────────────────────────
function Lightbox({ images, startIndex, onClose }) {
  const [idx, setIdx] = useState(startIndex);

  /* keyboard navigation */
  useEffect(() => {
    const handler = (e) => {
      if (e.key === 'Escape')      onClose();
      if (e.key === 'ArrowRight')  setIdx(i => Math.min(i + 1, images.length - 1));
      if (e.key === 'ArrowLeft')   setIdx(i => Math.max(i - 1, 0));
    };
    document.addEventListener('keydown', handler);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', handler);
      document.body.style.overflow = '';
    };
  }, [onClose, images.length]);

  const cur = images[idx];
  const hasPrev = idx > 0;
  const hasNext = idx < images.length - 1;

  return (
    <div
      className="lb-overlay fixed inset-0 z-[200] flex flex-col items-center justify-center"
      style={{ background: 'rgba(249,249,251,0.97)', backdropFilter: 'blur(14px)' }}
      onClick={onClose}
    >
      {/* Top bar */}
      <div className="absolute top-0 left-0 right-0 flex items-center justify-between px-6 py-4 z-10">
        <span className="text-xs font-mono text-muted tabular-nums">
          {String(idx + 1).padStart(2,'0')} / {String(images.length).padStart(2,'0')}
        </span>
        <button
          onClick={onClose}
          className="w-10 h-10 rounded-full border border-border bg-white shadow-sm flex items-center justify-center text-muted hover:text-text hover:border-text transition-all"
          aria-label="Fechar"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      {/* Main image */}
      <div
        className="lb-img relative flex flex-col items-center px-4"
        onClick={e => e.stopPropagation()}
      >
        <img
          key={cur.src}
          src={cur.src}
          alt={cur.alt}
          className="max-w-[88vw] max-h-[78vh] object-contain rounded-2xl"
          style={{ boxShadow: '0 24px 80px rgba(0,0,0,0.14)' }}
        />
        <p className="mt-5 text-sm text-muted font-medium">{cur.alt}</p>
      </div>

      {/* Prev / Next arrows */}
      {images.length > 1 && (
        <>
          <button
            className={`absolute left-4 md:left-8 w-12 h-12 rounded-full bg-white border border-border shadow-md flex items-center justify-center transition-all ${hasPrev ? 'text-muted hover:text-accent hover:border-accent' : 'opacity-25 cursor-not-allowed'}`}
            onClick={e => { e.stopPropagation(); if (hasPrev) setIdx(i => i - 1); }}
            aria-label="Anterior"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button
            className={`absolute right-4 md:right-8 w-12 h-12 rounded-full bg-white border border-border shadow-md flex items-center justify-center transition-all ${hasNext ? 'text-muted hover:text-accent hover:border-accent' : 'opacity-25 cursor-not-allowed'}`}
            onClick={e => { e.stopPropagation(); if (hasNext) setIdx(i => i + 1); }}
            aria-label="Próxima"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </>
      )}

      {/* Dot pagination */}
      {images.length > 1 && (
        <div className="absolute bottom-8 flex items-center gap-2">
          {images.map((_, i) => (
            <button
              key={i}
              onClick={e => { e.stopPropagation(); setIdx(i); }}
              className={`h-2 rounded-full transition-all duration-300 ${i === idx ? 'w-6 bg-accent' : 'w-2 bg-border hover:bg-muted'}`}
              aria-label={`Imagem ${i + 1}`}
            />
          ))}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// NAVBAR
// ─────────────────────────────────────────────────────────────────────────────
function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen]         = useState(false);

  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 48);
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);

  const links = [
    { label: 'Projetos', href: '#projects' },
    { label: 'Sobre',    href: '#about'    },
    { label: 'Contato',  href: '#footer'   },
  ];

  return (
    <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${
      scrolled
        ? 'py-3 bg-white/95 backdrop-blur-xl border-b border-border shadow-sm'
        : 'py-6 bg-transparent'
    }`}>
      <div className="max-w-6xl mx-auto px-6 flex items-center justify-between">
        <a href="#top" className="text-xl font-extrabold text-text tracking-tight">
          GN<span className="purple-text">.</span>
        </a>

        <ul className="hidden md:flex items-center gap-8">
          {links.map(l => (
            <li key={l.label}>
              <a href={l.href} className="nav-link text-muted hover:text-text text-sm font-semibold transition-colors duration-300">
                {l.label}
              </a>
            </li>
          ))}
        </ul>

        <a href="mailto:thegabecrate@gmail.com" className="hidden md:block btn-ghost">
          Vamos conversar

        {/* Hamburger */}

          className="md:hidden w-8 h-8 flex flex-col justify-center gap-[5px]"
          onClick={() => setOpen(o => !o)}
          aria-label="Menu"
        >
          <span className={`block h-0.5 bg-text rounded transition-all duration-300 origin-center ${open ? 'w-6 rotate-45 translate-y-[7px]' : 'w-6'}`} />
          <span className={`block h-0.5 bg-text rounded transition-all duration-300 ${open ? 'w-0 opacity-0' : 'w-5'}`} />
          <span className={`block h-0.5 bg-text rounded transition-all duration-300 origin-center ${open ? 'w-6 -rotate-45 -translate-y-[7px]' : 'w-6'}`} />
        </button>
      </div>

      {/* Mobile menu */}
      <div className={`md:hidden overflow-hidden transition-all duration-300 ${open ? 'max-h-64 opacity-100' : 'max-h-0 opacity-0'}`}>
        <div className="bg-white border-t border-border px-6 py-5 space-y-3">
          {links.map(l => (
            <a key={l.label} href={l.href} onClick={() => setOpen(false)}
               className="block text-muted hover:text-accent py-1.5 text-sm font-semibold transition-colors">
              {l.label}
            </a>
          ))}
          <a href="mailto:thegabecrate@gmail.com" className="btn-purple block text-center mt-3">
            Vamos conversar
          </a>
        </div>
      </div>
    </nav>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// ARTWORK CARD (shared between carousel + grid)
// ─────────────────────────────────────────────────────────────────────────────
function ArtCard({ file, label, title, ratio, pad, onClick, extraClass = '' }) {
  return (
    <div
      className={`card-lift rounded-xl overflow-hidden bg-white border border-border cursor-zoom-in ${extraClass}`}
      onClick={onClick}
      role="button"
      tabIndex={0}
      onKeyDown={e => e.key === 'Enter' && onClick()}
      aria-label={`Ampliar: ${title} ${label}`}
    >
      {/* Image area — object-contain so nada é cortado */}
      <div
        className="relative bg-surface2 overflow-hidden"
        style={{ aspectRatio: ratio }}
      >
        <img
          src={`./Artes/${file}`}
          alt={`${title} ${label}`}
          className={`w-full h-full object-contain ${pad} group-hover:scale-[1.03]`}
          loading="lazy"
        />
        {/* Zoom hint */}
        <div className="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/80 border border-border flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-sm">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" strokeWidth="2.5">
            <path d="M15 3h6v6M14 10l6.1-6.1M9 21H3v-6M10 14l-6.1 6.1"/>
          </svg>
        </div>
      </div>
      {/* Footer */}
      <div className="px-3 py-2.5 flex items-center justify-between border-t border-border">
        <p className="text-text text-xs font-semibold truncate">{title}</p>
        <span className="text-muted text-xs font-mono ml-2 flex-shrink-0">{label}</span>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CAROUSEL SECTION
// ─────────────────────────────────────────────────────────────────────────────
function CarouselSection({ project, onOpen }) {
  const trackRef = useRef(null);

  const scroll = useCallback((dir) => {
    const t = trackRef.current;
    if (!t) return;
    const item = t.querySelector('.carousel-item');
    if (!item) return;
    t.scrollBy({ left: dir * (item.offsetWidth + 16), behavior: 'smooth' });
  }, []);

  const images = project.items.map(it => ({
    src: `./Artes/${it.file}`,
    alt: `${project.title} ${it.label}`,
  }));

  return (
    <div className="mb-24">
      <div className="flex items-end justify-between mb-6">
        <div>
          <div className="s-line" />
          <h3 className="text-2xl md:text-3xl font-bold text-text">{project.title}</h3>
          <p className="text-muted text-sm mt-1">{project.description}</p>
        </div>
        <div className="flex gap-2 shrink-0 ml-4">
          {[-1, 1].map(dir => (
            <button
              key={dir}
              onClick={() => scroll(dir)}
              className="w-10 h-10 border border-border hover:border-accent text-muted hover:text-accent flex items-center justify-center transition-all duration-300 rounded-lg bg-white shadow-sm"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                {dir === -1 ? <path d="M15 18l-6-6 6-6"/> : <path d="M9 18l6-6-6-6"/>}
              </svg>
            </button>
          ))}
        </div>
      </div>

      <div className="carousel-track" ref={trackRef}>
        {project.items.map((item, i) => (
          <div key={item.file} className="carousel-item group">
            <ArtCard
              file={item.file}
              label={item.label}
              title={project.title}
              ratio={project.ratio}
              pad={project.pad}
              onClick={() => onOpen(images, i)}
            />
          </div>
        ))}
      </div>

      <p className="md:hidden text-muted text-xs text-center mt-4 tracking-wide">← deslize para ver mais →</p>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// GRID SECTION
// ─────────────────────────────────────────────────────────────────────────────
function GridSection({ project, onOpen }) {
  const cols = project.items.length === 2
    ? 'sm:grid-cols-2'
    : 'sm:grid-cols-2 lg:grid-cols-3';

  const images = project.items.map(it => ({
    src: `./Artes/${it.file}`,
    alt: `${project.title} ${it.label}`,
  }));

  return (
    <div className="mb-24">
      <div className="mb-6">
        <div className="s-line" />
        <div className="flex items-center gap-3 flex-wrap">
          <h3 className="text-2xl md:text-3xl font-bold text-text">{project.title}</h3>
          {project.badge && (
            <span className="text-[10px] font-bold tracking-widest text-accent border border-accent/30 bg-accent/5 px-2.5 py-0.5 rounded-full uppercase">
              {project.badge}
            </span>
          )}
        </div>
        <p className="text-muted text-sm mt-1">{project.description}</p>
      </div>

      <div className={`grid grid-cols-1 ${cols} gap-5`}>
        {project.items.map((item, i) => (
          <div key={item.file} className="group">
            <ArtCard
              file={item.file}
              label={item.label}
              title={project.title}
              ratio={project.ratio}
              pad={project.pad}
              onClick={() => onOpen(images, i)}
            />
          </div>
        ))}
      </div>
    </div>
  );
}

function Projects() {
  const [lb, setLb] = useState(null); // { images, startIndex }

        )}

      {lb && <Lightbox images={lb.images} startIndex={lb.startIndex} onClose={close} />}
    </section>
  );
}
