  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:        '#070708',
            surface:   '#111113',
            surface2:  '#1C1C1F',
            accent:    '#C9A96E',
            border:    '#252527',
            text:      '#F2F2F0',
            muted:     '#6B6B6B',

          fontFamily: {
            display: ['"Playfair Display"', 'serif'],
            sans:    ['"DM Sans"', 'sans-serif'],

  <style>
    html, body { background-color: #070708; color: #F2F2F0; font-family: 'DM Sans', sans-serif; }

    /* ── Grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #111113; }
    ::-webkit-scrollbar-thumb { background: #C9A96E44; border-radius: 2px; }

    /* ── Gold gradient text ── */
    .gold-text {
      background: linear-gradient(135deg, #B8945A 0%, #E8CBAB 50%, #C9A96E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 0.4s; }
    .d4 { animation-delay: 0.55s; }

    /* ── Card lift ── */
    .card-lift {
      transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.45s ease;
    }
    .card-lift:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.55), 0 0 0 1px #C9A96E22;
    }

    /* ── Nav underline ── */
    .nav-link { position: relative; }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 1px;
      background: #C9A96E;
      transition: width 0.35s ease;
    }
    .nav-link:hover::after { width: 100%; }

    /* ── Carousel ── */
    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      gap: 16px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .carousel-item {
      scroll-snap-align: start;
      flex: 0 0 calc(33.333% - 11px);
    }
    @media (max-width: 768px) {
      .carousel-item { flex: 0 0 80%; }
    }

    /* ── Section divider line ── */
    .s-line {
      width: 36px; height: 2px;
      background: linear-gradient(90deg, #C9A96E, transparent);
      margin-bottom: 16px;
    }

    /* ── Smooth image reveal ── */
    img { transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

    /* ── Glow button ── */
    .btn-gold {
      background: #C9A96E;
      color: #070708;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 12px 28px;
      border-radius: 2px;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .btn-gold:hover {
      background: #DFB87A;
      box-shadow: 0 0 32px #C9A96E44;
    }

    .btn-ghost {
      color: #6B6B6B;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 12px 28px;
      border: 1px solid #252527;
      border-radius: 2px;
      transition: border-color 0.3s ease, color 0.3s ease;
    }
    .btn-ghost:hover { border-color: #C9A96E; color: #C9A96E; }
  </style>
</head>

// NAVBAR

function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen]         = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 48);

    { label: 'Sobre',    href: '#about'    },
    { label: 'Contato',  href: '#footer'   },

  return (
    <nav
      className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${

          <span className={`block w-6 h-0.5 bg-text transition-all duration-300 ${open ? 'opacity-0 scale-x-0' : ''}`} />

// ─────────────────────────────────────────────────────────────────────────────
// CAROUSEL SECTION
// ─────────────────────────────────────────────────────────────────────────────
function CarouselSection({ project }) {
  const trackRef = useRef(null);

  const scroll = useCallback((dir) => {
    const track = trackRef.current;
    if (!track) return;
    const item = track.querySelector('.carousel-item');
    if (!item) return;
    const gap = 16;
    track.scrollBy({ left: dir * (item.offsetWidth + gap), behavior: 'smooth' });
  }, []);

  return (
    <div className="mb-24">
      <div className="flex items-end justify-between mb-6 px-1">
        <div>
          <div className="s-line" />
          <h3 className="font-display text-2xl md:text-3xl font-bold text-text">{project.title}</h3>
          <p className="text-muted text-sm mt-1">{project.description}</p>
        </div>
        <div className="flex gap-2 shrink-0 ml-4">
          {[-1, 1].map(dir => (
            <button key={dir} onClick={() => scroll(dir)}
                    className="w-10 h-10 border border-border hover:border-accent text-muted hover:text-accent flex items-center justify-center transition-all duration-300 rounded-sm">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                {dir === -1 ? <path d="M15 18l-6-6 6-6"/> : <path d="M9 18l6-6-6-6"/>}
              </svg>
            </button>
          ))}
        </div>
      </div>

      <div className="carousel-track" ref={trackRef}>
        {project.items.map((item, i) => (
          <div key={item.file} className="carousel-item card-lift rounded-sm overflow-hidden bg-surface2 border border-border">
            <div className={`relative ${project.aspect} overflow-hidden`}>
              <img
                src={`./Artes/${item.file}`}
                alt={`${project.title} ${item.label}`}
                className="w-full h-full object-cover hover:scale-105"
                loading="lazy"
              />
            </div>
            <div className="p-3 flex items-center justify-between">
              <p className="text-text text-xs font-medium">{project.title}</p>
              <span className="text-muted text-xs font-mono">{item.label}</span>
            </div>
          </div>
        ))}
      </div>

      {/* Swipe hint on mobile */}
      <p className="md:hidden text-muted text-xs text-center mt-4 tracking-wide">← deslize para ver mais →</p>
    </div>
  );
}
